<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemanda – Testseite</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    button { font-size: 1rem; padding: .5rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Gemanda</h1>
  <p>Die Testseite läuft. GitHub Pages funktioniert.</p>
  <button id="btn">Klick mich</button>
  <p id="out"></p>
  <script>
    let n = 0;
    document.getElementById('btn').addEventListener('click', () => {
      n++;
      document.getElementById('out').textContent = 'JavaScript funktioniert: ' + n + ' Klick(s)';
    });
  </script>
</body>
</html>
